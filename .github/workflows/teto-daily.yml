# Refresh stars, languages, the activity strip, Teto's mood and her "latest push" line once a day,
# and rebuild right away when the config, template or generator changes on main.
name: teto daily

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - teto/config.json
      - teto/README.template.md
      - teto/build.py
      - teto/lib.py

concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: teto/requirements.txt

      - run: pip install -r teto/requirements.txt

      - name: Fetch numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: python teto/fetch.py

      - run: python teto/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md teto/data.json teto/guests assets/teto
          git commit -m "teto: daily refresh" || exit 0
          for i in 1 2 3; do git push && break; git pull --rebase; done
