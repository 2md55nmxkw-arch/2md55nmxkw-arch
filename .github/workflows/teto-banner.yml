# Re-render the animated banners (every mood, dark and light) from teto/banner/source/teto-idle.mp4.
# Run it by hand (Actions → teto banner → Run workflow) after changing render.py, or the first two
# projects in teto/config.json: those are the cards in focus.
name: teto banner

on:
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: teto/banner/requirements.txt

      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - run: pip install -r teto/banner/requirements.txt

      - run: bash teto/banner/make.sh

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/teto/banner*.webp assets/teto/banner*-static.png
          git commit -m "teto: re-render banner" || exit 0
          for i in 1 2 3; do git push && break; git pull --rebase; done
