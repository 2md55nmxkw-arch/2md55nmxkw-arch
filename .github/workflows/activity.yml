# «Every commit is a move»: раз в день перерисовывает доску из последних 64 дней контрибуций.
name: activity

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# общий с шахматами замок — оба пишут в README
concurrency:
  group: readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Render the activity board
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGIN: ${{ github.repository_owner }}
        run: node chess/activity.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md chess
          git diff --cached --quiet || { git commit -m "activity: refresh the commit board"; git push; }
