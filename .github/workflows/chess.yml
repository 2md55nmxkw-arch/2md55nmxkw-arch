# Открытая партия в README: issue с заголовком «chess|move|e2e4» = ход.
# Заголовок присылают посторонние — он передаётся только через env и разбирается строгой регуляркой в chess/game.mjs.
name: chess

on:
  issues:
    types: [opened]

# ходы обрабатываются строго по одному, чтобы два одновременных хода не затёрли друг друга
concurrency:
  group: chess
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  move:
    if: startsWith(github.event.issue.title, 'chess|')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Play the move
        id: play
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node chess/game.mjs

      - name: Commit the new position
        if: steps.play.outputs.result == 'ok'
        env:
          MOVE: ${{ steps.play.outputs.move }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md chess
          git commit -m "chess: $MOVE by @$ISSUE_USER"
          git push

      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -f chess/.comment.md ] || echo "Something went wrong on my side, the move wasn't applied. Please try again in a minute." > chess/.comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file chess/.comment.md || true
          gh issue close "$ISSUE_NUMBER"
